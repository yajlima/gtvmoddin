[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "username-bot"
version = "0.1.0"
description = "Telegram bot that hands out a random username from the listing that sold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
username-bot = "username_bot.__main__:main"

[tool.setuptools]
packages = ["username_bot"]
