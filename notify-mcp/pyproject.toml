[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents text you, call you, and ask you questions via Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
notify-mcp = "notify_mcp.__main__:main"

[tool.setuptools]
packages = ["notify_mcp"]
