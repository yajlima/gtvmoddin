[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-mcp"
version = "0.1.0"
description = "MCP server that connects AI agents to WhatsApp via the official Business Cloud API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.__main__:main"

[tool.setuptools]
packages = ["whatsapp_mcp"]
